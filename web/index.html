  <title>Near</title>
  <!-- On a phone, "Add to Home Screen" makes it open like an app, without the browser bars. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preload" href="fonts/atkinson-hyperlegible-next-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

<body>
  <div id="reminder" class="reminder" role="alert" hidden>
    <svg class="reminder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
    <p></p>
    <a class="button primary" id="reminder-go" href="#/walk" hidden>Take me there</a>
    <button class="button primary" id="reminder-done" type="button" hidden>Done</button>
    <button class="button" type="button">OK</button>
  </div>

  <main id="screen"></main>

  <nav class="tabs" aria-label="Main">
    <a href="#/" data-tab="home"><span class="tab-icon"></span>Today</a>
    <a href="#/agenda" data-tab="agenda"><span class="tab-icon"></span>Agenda</a>
    <a href="#/people" data-tab="people"><span class="tab-icon"></span>People</a>
    <a href="#/diary" data-tab="diary"><span class="tab-icon"></span>Diary</a>
    <a href="#/listen" data-tab="listen"><span class="tab-icon"></span>Listen</a>
  </nav>

  <script src="js/dates.js"></script>
  <script src="js/data.js"></script>
  <script src="js/mic.js"></script>

  <script src="js/places.js"></script>

  <script src="js/views.js"></script>
  <script src="js/graph.js"></script>

  <script src="js/listen.js"></script>
  <script src="js/day.js"></script>
  <script src="js/walk.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/account.js"></script>
  <script src="js/relatives.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/routine.js"></script>
